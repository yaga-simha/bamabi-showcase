[package]
name = "deterministic_gate"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[[bench]]
name = "callgrind_gate"
path = "benches/callgrind_gate.rs"
harness = false

[dependencies]
bamabi_sys = { git = "https://github.com/yaga-simha/bamabi-wire.git", branch = "main" }
bamabi_host_sys = { git = "https://github.com/yaga-simha/bamabi-core.git", branch = "main" }
bamabi_host = { git = "https://github.com/yaga-simha/bamabi-core.git", branch = "main" }
bevy_ecs = { version = "0.20.1", default-features = false, features = ["std", "async_executor"] }
bevy_app = { version = "0.20.1", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
iai-callgrind = "0.16"
